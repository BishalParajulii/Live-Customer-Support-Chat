<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .chat-box {
            width: 400px;
            height: 550px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
        }

        .chat-header span {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
            display: block;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }

        .message.customer {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.agent {
            background: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            font-size: 12px;
            color: #888;
            padding: 4px 8px;
            min-height: 20px;
        }

        .msg-meta {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .timestamp {
            font-size: 10px;
            color: #999;
        }

        .tick {
            font-size: 10px;
            color: #8a8a8a;
            letter-spacing: -2px;
        }

        .tick.seen {
            color: #34b7f1;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            border-color: #075e54;
        }

        .chat-input-area button {
            background: #075e54;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
        }

        .chat-input-area button:hover {
            background: #128c7e;
        }

        .rating-modal {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        .rating-modal.show {
            display: flex;
        }

        .rating-box {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 280px;
        }

        .rating-box h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .rating-box p {
            font-size: 13px;
            color: #888;
            margin-bottom: 16px;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .star {
            font-size: 32px;
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s;
        }

        .star.active {
            color: #f4c542;
        }

        .rating-box textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .rating-box button {
            background: #075e54;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="chat-header">
        SwiftDesk Support
        <span id="status">Connecting...</span>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="typing-indicator" id="typing"></div>

    <div class="chat-input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
            autocomplete="off"
        />
        <button onclick="sendMessage()">➤</button>
    </div>

    <div class="rating-modal" id="ratingModal">
        <div class="rating-box">
            <h3>Rate your experience</h3>
            <p>How was your support session?</p>
            <div class="stars" id="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <textarea id="feedback" rows="3" placeholder="Optional feedback..."></textarea>
            <button onclick="submitRating()">Submit</button>
        </div>
    </div>
</div>

<script>
    const sessionId = "{{ session_id }}";
    const senderType = "{{ sender_type }}" || 'customer';

    const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${wsScheme}://${window.location.host}/ws/chat/${sessionId}/`);

    ws.onopen = () => {
        document.getElementById('status').innerText = 'Connected';
    };

    ws.onclose = () => {
        document.getElementById('status').innerText = 'Disconnected';
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'message') {
            appendMessage(data.content, data.sender_type, data.timestamp || '', data.is_read || false);
            clearTyping();
            if (data.sender_type !== senderType) {
                ws.send(JSON.stringify({ type: 'read', sender_type: senderType }));
            }
        } else if (data.type === 'typing') {
            if (data.sender_type !== senderType) {
                showTyping(data.sender_type);
            }
        } else if (data.type === 'read') {
            if (data.reader_type !== senderType) {
                markOwnMessagesSeen();
            }
        } else if (data.type === 'closed') {
            document.getElementById('status').innerText = 'Session Closed';
            document.getElementById('messageInput').disabled = true;
            document.getElementById('ratingModal').classList.add('show');
        }
    };

    let typingTimer;
    document.getElementById('messageInput').addEventListener('input', () => {
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'typing', sender_type: senderType }));
        clearTimeout(typingTimer);
        typingTimer = setTimeout(clearTyping, 2000);
    });

    document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
            type: 'message',
            content: content,
            sender_type: senderType
        }));
        input.value = '';
    }

    function appendMessage(content, sender, timestamp = '', isRead = false) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';
        contentDiv.innerText = content;
        div.appendChild(contentDiv);

        const metaDiv = document.createElement('div');
        metaDiv.className = 'msg-meta';

        const timestampSpan = document.createElement('span');
        timestampSpan.className = 'timestamp';
        timestampSpan.innerText = timestamp || new Date().toLocaleTimeString();
        metaDiv.appendChild(timestampSpan);

        if (sender === senderType) {
            const readStatusSpan = document.createElement('span');
            readStatusSpan.className = isRead ? 'tick seen' : 'tick';
            readStatusSpan.innerText = '✓✓';
            metaDiv.appendChild(readStatusSpan);
        }

        div.appendChild(metaDiv);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function markOwnMessagesSeen() {
        document.querySelectorAll('.message.customer .tick').forEach(tick => {
            tick.classList.add('seen');
        });
    }

    function showTyping(sender) {
        document.getElementById('typing').innerText = `${sender} is typing...`;
    }

    function clearTyping() {
        document.getElementById('typing').innerText = '';
    }

    let selectedScore = 0;

    document.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', () => {
            selectedScore = parseInt(star.dataset.value);
            document.querySelectorAll('.star').forEach(s => {
                s.classList.toggle('active', parseInt(s.dataset.value) <= selectedScore);
            });
        });
    });

    function submitRating() {
        if (!selectedScore) {
            alert('Please select a star rating.');
            return;
        }
        fetch(`/chat/${sessionId}/rate/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                score: selectedScore,
                feedback: document.getElementById('feedback').value
            })
        }).then(res => res.json()).then(data => {
            if (data.success) {
                document.getElementById('ratingModal').classList.remove('show');
                alert('Thank you for your feedback!');
            }
        });
    }
</script>

</body>
</html>
