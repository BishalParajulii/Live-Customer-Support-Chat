<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent - Session {{ session_id }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .chat-box {
            width: 400px;
            height: 550px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: #2c459c;
            color: white;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .header-info span {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
            display: block;
        }

        .close-btn {
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
        }

        .close-btn:hover {
            background: #b71c1c;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }

        .message.customer {
            background: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.agent {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .typing-indicator {
            font-size: 12px;
            color: #888;
            padding: 4px 8px;
            min-height: 20px;
        }

        .msg-meta {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            font-size: 10px;
            color: #999;
            margin-top: 2px;
        }

        .timestamp {
            font-size: 10px;
            color: #999;
        }

        .tick {
            font-size: 10px;
            color: #8a8a8a;
            letter-spacing: -2px;
        }

        .tick.seen {
            color: #34b7f1;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:focus {
            border-color: #2c459c;
        }

        .chat-input-area button {
            background: #2c459c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
        }

        .chat-input-area button:hover {
            background: #3a5bc7;
        }
    </style>
</head>
<body>

<div class="chat-box">
    <div class="chat-header">
        <div class="header-info">
            SwiftDesk Agent
            <span id="status">Connecting...</span>
        </div>
        <button class="close-btn" onclick="closeSession()">End Chat</button>
    </div>

    <div class="chat-messages" id="messages"></div>

    <div class="typing-indicator" id="typing"></div>

    <div class="chat-input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Reply as agent..."
            autocomplete="off"
        />
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const sessionId = "{{ session_id }}";
    const senderType = "agent";

    const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${wsScheme}://${window.location.host}/ws/chat/${sessionId}/`);

    ws.onopen = () => {
        document.getElementById('status').innerText = 'Connected';
    };

    ws.onclose = () => {
        document.getElementById('status').innerText = 'Disconnected';
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'message') {
            appendMessage(data.content, data.sender_type, data.timestamp || '', data.is_read || false);
            clearTyping();
            if (data.sender_type !== senderType) {
                ws.send(JSON.stringify({ type: 'read', sender_type: senderType }));
            }
        } else if (data.type === 'typing') {
            if (data.sender_type !== senderType) {
                showTyping(data.sender_type);
            }
        } else if (data.type === 'read') {
            if (data.reader_type !== senderType) {
                markOwnMessagesSeen();
            }
        } else if (data.type === 'closed') {
            document.getElementById('status').innerText = 'Session Closed';
            document.getElementById('messageInput').disabled = true;
        }
    };

    let typingTimer;
    document.getElementById('messageInput').addEventListener('input', () => {
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: 'typing', sender_type: senderType }));
        clearTimeout(typingTimer);
        typingTimer = setTimeout(clearTyping, 2000);
    });

    document.getElementById('messageInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) return;
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
            type: 'message',
            content: content,
            sender_type: senderType
        }));
        input.value = '';
    }

    function appendMessage(content, sender, timestamp = '', isRead = false) {
        const messages = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${sender}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';
        contentDiv.innerText = content;
        div.appendChild(contentDiv);

        const metaDiv = document.createElement('div');
        metaDiv.className = 'msg-meta';

        const timestampSpan = document.createElement('span');
        timestampSpan.className = 'timestamp';
        timestampSpan.innerText = timestamp || new Date().toLocaleTimeString();
        metaDiv.appendChild(timestampSpan);

        if (sender === senderType) {
            const readStatusSpan = document.createElement('span');
            readStatusSpan.className = isRead ? 'tick seen' : 'tick';
            readStatusSpan.innerText = '✓✓';
            metaDiv.appendChild(readStatusSpan);
        }

        div.appendChild(metaDiv);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function markOwnMessagesSeen() {
        document.querySelectorAll('.message.agent .tick').forEach(tick => {
            tick.classList.add('seen');
        });
    }

    function showTyping(sender) {
        document.getElementById('typing').innerText = `${sender} is typing...`;
    }

    function clearTyping() {
        document.getElementById('typing').innerText = '';
    }

    function closeSession() {
        if (!confirm('End this chat session?')) return;
        ws.send(JSON.stringify({ type: 'close' }));
    }
</script>

</body>
</html>
